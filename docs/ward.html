<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>병동 모니터</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="ward-page">

  <header class="ward-header">
    <div class="header-left">
      <h1>병동 모니터</h1>
      <div class="ward-selector">
        <label>병동 선택</label>
        <select id="ward-select" onchange="filterWard()">
          <option value="">전체</option>
          <optgroup label="7층"><option>7층 1병동</option><option>7층 2병동</option></optgroup>
          <optgroup label="8층"><option>8층 1병동</option><option>8층 2병동</option></optgroup>
          <optgroup label="9층"><option>9층 1병동</option><option>분만실</option></optgroup>
          <optgroup label="10층"><option>10층 1병동</option><option>10층 2병동</option></optgroup>
          <optgroup label="11층"><option>11층 1병동</option><option>11층 2병동</option></optgroup>
          <optgroup label="12층"><option>12층 1병동</option><option>12층 2병동</option></optgroup>
          <optgroup label="13층"><option>13층 1병동</option><option>13층 2병동</option></optgroup>
          <optgroup label="14층"><option>14층 1병동</option><option>14층 2병동</option></optgroup>
          <optgroup label="15층"><option>15층 1병동</option><option>15층 2병동</option></optgroup>
          <optgroup label="16층"><option>16층 1병동</option><option>16층 2병동</option></optgroup>
          <optgroup label="17층"><option>17층 1병동</option><option>17층 2병동</option></optgroup>
          <optgroup label="18층"><option>18층 1병동</option><option>18층 2병동</option></optgroup>
          <optgroup label="19층"><option>19층 1병동</option><option>19층 2병동</option></optgroup>
          <optgroup label="20층"><option>20층 1병동</option><option>20층 2병동</option></optgroup>
          <optgroup label="21층"><option>21층 1병동</option><option>21층 2병동</option></optgroup>
        </select>
      </div>
    </div>
    <div id="conn-dot" class="conn-dot disconnected" title="서버 연결 상태"></div>
  </header>

  <!-- ═══ AI 실시간 회복실 자원 관리 대시보드 ═══ -->
  <div id="room-summary-bar" class="room-summary-bar"></div>
  <div class="ai-bar">
    <span class="ai-bar-title">🤖 AI 실시간 분석</span>
    <span class="ai-chip ai-chip-gray">총원&nbsp;<strong id="ai-total">0명</strong></span>
    <span class="ai-chip ai-chip-green">퇴실예정&nbsp;<strong id="ai-ready">0명</strong></span>
    <span class="ai-chip ai-chip-blue">평균체류&nbsp;<strong id="ai-avg-stay">계산 중</strong></span>
    <span class="ai-chip ai-chip-gray" id="ai-congestion-chip"><span id="ai-congestion">침상정체&nbsp;<strong>없음</strong></span></span>
  </div>

  <!-- ═══ AI 병동 브리핑 (선택한 병동 환자 현황을 문장으로 요약) ═══ -->
  <div class="ai-briefing">
    <span class="ai-briefing-icon">🤖</span>
    <span class="ai-briefing-text" id="ai-briefing-text">환자 현황을 분석 중입니다...</span>
  </div>

  <div id="empty-state" class="empty-state">현재 회복실에 입실 중인 환자가 없습니다.</div>
  <div id="ward-list"></div>

  <!-- ═══ AI 인계 요약 모달 ═══ -->
  <div id="handover-modal" class="hm-overlay" onclick="closeHandoverOverlay(event)">
    <div class="hm-box">
      <div class="hm-header">
        <span class="hm-title">🤖 AI 기반 병동 인계 스크립트 요약</span>
        <button class="hm-close" onclick="closeHandover()">✕</button>
      </div>
      <div class="hm-subheader">
        <span class="hm-badge" id="handover-badge"></span>
        <button class="hm-key-btn" onclick="promptGeminiApiKey()">⚙ Gemini API 키 설정</button>
      </div>
      <div class="hm-badge-detail" id="handover-badge-detail" style="display:none"></div>
      <div class="hm-body" id="handover-text"></div>
      <div class="hm-footer">
        <button class="hm-copy-btn" onclick="copyHandover()">📋 복사</button>
        <button class="hm-close-btn" onclick="closeHandover()">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js?v=4"></script>
  <script src="common.js?v=9"></script>
  <script src="ward.js?v=4"></script>
</body>
</html>
